name: Build SnowKeyboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SnowKeyboard_GitHub_Build.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q SnowKeyboard_GitHub_Build.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/SnowKeyboard
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnowKeyboard-APK
          path: extracted/SnowKeyboard/app/build/outputs/apk/debug/*.apk
